name: Rilis APK PureWave

# Build APK release (R8 + shrinkResources, ditandatangani kunci fork ini).
# Dijalankan manual dari tab Actions → "Run workflow".
# Butuh repository secrets: RELEASE_KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD (lihat docs/ARCHITECTURE.md bagian 5).
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan keystore rilis
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/purewave-release.jks
          test -s /tmp/purewave-release.jks
          sha256sum /tmp/purewave-release.jks

      - name: Verifikasi keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore /tmp/purewave-release.jks \
            -storepass "$STORE_PASS" -alias "$KEY_ALIAS"

      - name: Build APK release
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PputarStoreFile=/tmp/purewave-release.jks \
            -PputarStorePass="$STORE_PASS" \
            -PputarKeyAlias="$KEY_ALIAS" \
            -PputarKeyPass="$KEY_PASS"

      - name: Simpan APK release
        uses: actions/upload-artifact@v7
        with:
          name: purewave-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Rilis $TAG sudah ada — lewati pembuatan."
          else
            cp app/build/outputs/apk/release/app-release.apk "purewave-$TAG.apk"
            sha256sum "purewave-$TAG.apk" > "purewave-$TAG.apk.sha256"
            cat > NOTES.md << 'EOF'
          Poles UI menyeluruh biar ga ngebosenin:
          - Avatar artis kini warna-warni (6 gradien berbeda, dipilih dari nama)
          - Semua kartu & tombol memantul pegas saat ditekan
          - Baris lagu mengecil halus saat disentuh
          - Ikon tab bawah membesar halus saat terpilih
          - Kartu "Lanjutkan mendengarkan": tombol putar gradien + bar progres gradien
          - Judul seksi & ikon folder: sentuhan gradien baru
          - Kartu hero: pendar ganda + efek tekan

          Catatan install: build dari fork dengan kunci tanda tangan baru.
          Backup dulu via Setelan → Backup, uninstall versi lama/asli,
          baru install APK ini. Update berikutnya bisa langsung timpa.
          EOF
            gh release create "$TAG" \
              --title "PureWave $TAG — poles UI" \
              --notes-file NOTES.md \
              "purewave-$TAG.apk" "purewave-$TAG.apk.sha256"
          fi
