name: Rilis APK PureWave

# Build APK release (R8 + shrinkResources, ditandatangani kunci fork ini).
# Dijalankan manual dari tab Actions → "Run workflow".
# Butuh repository secrets: RELEASE_KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD (lihat docs/ARCHITECTURE.md bagian 5).
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan keystore rilis
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/purewave-release.jks
          test -s /tmp/purewave-release.jks
          sha256sum /tmp/purewave-release.jks

      - name: Verifikasi keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore /tmp/purewave-release.jks \
            -storepass "$STORE_PASS" -alias "$KEY_ALIAS"

      - name: Build APK release
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PputarStoreFile=/tmp/purewave-release.jks \
            -PputarStorePass="$STORE_PASS" \
            -PputarKeyAlias="$KEY_ALIAS" \
            -PputarKeyPass="$KEY_PASS"

      - name: Simpan APK release
        uses: actions/upload-artifact@v7
        with:
          name: purewave-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.25.0 >/dev/null 2>&1; then
            echo "Rilis v2.25.0 sudah ada — lewati pembuatan."
          else
            cp app/build/outputs/apk/release/app-release.apk purewave-v2.25.0.apk
            sha256sum purewave-v2.25.0.apk > purewave-v2.25.0.apk.sha256
            cat > NOTES.md << 'EOF'
          Layar pemutar dipoles:
          - Artwork "bernapas": membesar halus saat lagu diputar
          - Bingkai gradien + bayangan berwarna mengikuti warna sampul
          - Tombol play memantul pegas saat ditekan
          - Bar progres gradien
          - Sudut atas sheet membulat
          - Chip aksi (Kecepatan/Lirik/Equalizer/Antrian) jadi kaca dengan efek tekan

          Catatan install: build dari fork dengan kunci tanda tangan baru.
          Backup dulu via Setelan → Backup, uninstall versi lama/asli,
          baru install APK ini. Update berikutnya bisa langsung timpa.
          EOF
            gh release create v2.25.0 \
              --title "PureWave v2.25.0 — poles layar pemutar" \
              --notes-file NOTES.md \
              purewave-v2.25.0.apk purewave-v2.25.0.apk.sha256
          fi
